name: Build and publish SIGA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: siga-main/package.json

      - name: Install dependencies
        working-directory: siga-main
        run: npm install --no-audit --no-fund

      - name: Build
        working-directory: siga-main
        run: npm run build

      # Also publish the built files at the repository root. This supports
      # Pages configurations that still publish from main / (root).
      - name: Copy production site to repository root
        run: |
          rm -rf assets index.html .nojekyll
          cp -a siga-main/dist/. .
          touch .nojekyll

      - name: Commit root site for branch-based Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html assets .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "Publish built SIGA site"
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: siga-main/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
